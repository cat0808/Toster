<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Островок уверенности</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top">
    <h1>🌴 Островок уверенности</h1>
    <button id="themeToggle">🌙 Ночная</button>
  </header>

  <nav id="menu" class="menu"></nav>

  <main>
    <section id="puzzlesPanel" class="panel hidden">
      <h2>🧩 Головоломки</h2>
      <div class="row">
        <label>Сложность:
          <select id="difficulty">
            <option value="easy">Лёгкая</option>
            <option value="medium">Средняя</option>
            <option value="hard">Сложная</option>
          </select>
        </label>
        <button id="newGame">🔄 Новая игра</button>
      </div>
      <div id="puzzleTabs" class="tabs"></div>
      <div id="puzzleArea"></div>
    </section>

    <section id="musicPanel" class="panel hidden">
      <h2>🎵 Музыка</h2>
      <div id="musicList" class="list"></div>
      <p id="musicNow" class="now-playing">Сейчас ничего не играет</p>
    </section>

    <section id="videosPanel" class="panel hidden">
      <h2>🎬 Видео с Rutube</h2>
      <div id="rutubeList" class="list"></div>
      <iframe id="rutubeFrame" allowfullscreen></iframe>
    </section>

    <section id="photosPanel" class="panel hidden">
      <h2>🖼 Картинки</h2>
      <div id="photoFeed" class="photo-feed"></div>
    </section>

    <section id="chatPanel" class="panel hidden">
      <h2>💬 ИИ психолог</h2>
      <div id="chatLog" class="chat-log"></div>
      <form id="chatForm" class="row">
        <input id="chatInput" placeholder="Напиши, что тебя беспокоит..." />
        <button>Отправить</button>
      </form>
    </section>
  </main>

  <script>
    window.AI_BACKEND_URL = window.AI_BACKEND_URL || "";
    window.AUTHORIZATION_KEY = window.AUTHORIZATION_KEY || "";
  </script>
  <script src="./app.js"></script>
</body>
</html>
