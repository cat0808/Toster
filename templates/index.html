<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Мультимедиа</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
    <h1>Мультимедиа</h1>
    <select id="themeSelect">
      <option>Светлая</option><option>Тёмная</option><option>Фиолетовая</option><option>Зелёная</option><option>Оранжевая</option><option>Бирюзовая</option>
    </select>
  </header>

  <nav class="tabs">
    <button data-tab="music" class="active">Музыка</button>
    <button data-tab="video">Видео</button>
    <button data-tab="images">Картинки</button>
    <button data-tab="puzzles">Головоломки</button>
    <button data-tab="ai">ИИ</button>
  </nav>

  <main>
    <section id="music" class="tab active">
      <p id="musicLabel">Нажмите «Начать слушать музыку»</p>
      <div class="row">
        <button id="startMusic">Начать слушать музыку</button>
        <button id="prevMusic">◀</button>
        <button id="nextMusic">▶</button>
      </div>
      <audio id="audioPlayer" controls></audio>
    </section>

    <section id="video" class="tab">
      <select id="videoSelect"></select>
      <p id="videoInfo">Выберите видео</p>
    </section>

    <section id="images" class="tab">
      <p id="imageLabel">Нажмите «Начать смотреть картинки»</p>
      <div class="row">
        <button id="startImage">Начать смотреть картинки</button>
        <button id="prevImage">◀</button>
        <button id="nextImage">▶</button>
      </div>
      <img id="imageView" alt="preview" />
    </section>

    <section id="puzzles" class="tab">
      <p id="puzzleStatus">Выберите игру</p>
      <button id="newPuzzle">Новая игра</button>
      <div class="row">
        <button data-pz="15" class="pz active">Пятнашки</button>
        <button data-pz="mem" class="pz">Найди пару</button>
        <button data-pz="ttt" class="pz">Крестики-нолики</button>
      </div>
      <div id="board15" class="board15"></div>
      <div id="boardMem" class="boardMem hidden"></div>
      <div id="boardTtt" class="boardTtt hidden"></div>
    </section>

    <section id="ai" class="tab">
      <textarea id="prompt" placeholder="Ваш запрос..."></textarea>
      <button id="sendAi">Отправить</button>
      <pre id="answer"></pre>
    </section>
  </main>

  <script>
    window.__DATA__ = {
      audio: {{ audio_files|tojson }},
      video: {{ video_files|tojson }},
      images: {{ image_files|tojson }}
    };
  </script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
